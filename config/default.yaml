mode:
  name: backtest

account:
  expected_account_id: null
  expected_server: null
  account_currency: USD

paths:
  data_dir: data
  output_dir: runs

data:
  source: csv
  timezone: broker
  timestamp_semantics: candle_open_time
  missing_bar_policy: warn
  max_missing_bar_ratio: 0.001
  allow_session_gaps: true
  max_session_gap_minutes: 180
  allow_sample_data: false
  require_real_data: true
  auto_fetch_latest: true
  min_bars: 5000
  backfill_bars: 20000

symbols:
  enabled: [XAUUSDm]
  registry:
    XAUUSDm:
      asset_class: metal
      magic: 7001
      pip_size: 0.01
      pip_value: 1.0
      tick_size: 0.01
      tick_value: 1.0
      contract_size: 100
      min_lot: 0.01
      max_lot: 1.0
      lot_step: 0.01
      average_spread: 160
      max_spread_points: 280
      trading_session: "24x5"
      broker_suffix: "m"
      metadata_confirmed: false
      metadata_source: config

risk:
  profile: conservative
  risk_per_trade: 0.0025
  daily_loss_limit: 0.01
  weekly_loss_limit: 0.03
  max_drawdown: 0.10
  max_open_positions: 2
  max_symbol_exposure: 1
  max_lot: 0.10
  kill_switch_behavior: HALT_NEW_TRADES
  emergency_stop_file: EMERGENCY_STOP

signal:
  strategy: atr_breakout
  buy_threshold: 0.60
  sell_threshold: 0.60
  min_rr: 1.5

filters:
  max_spread_multiplier: 2.5
  max_spread_percentile: 0.95
  min_atr: 0.0

session_filters:
  allowed_sessions: [Asia, London, NewYork]
  exclude_rollover: true

regime_filters:
  allowed_trend_regimes: []
  allowed_range_regimes: []

backtest:
  initial_equity: 10000
  same_bar_policy: conservative
  execute_signal_at: next_open
  slippage_model: base
  commission_per_lot: 0
  spread_cost_multiplier: 1.0
  time_stop_bars: 24

edge:
  enabled: true
  require_real_data: true
  min_bars: 5000
  min_trades: 30
  min_profit_factor: 1.15
  min_expectancy: 0.0
  max_drawdown: 0.20
  require_beats_baselines: true
  baselines: [no_trade, random_entry, ma_crossover, atr_breakout, session_breakout]
  require_stress_expectancy_positive: true
  stress_slippage_models: [bad, stress]

symbol_audit:
  require_broker_metadata: true
  max_spread_median_to_config_ratio: 3.0

strategy_library:
  rule_based_only: true
  disabled: [model_probability]

strategy_viability:
  min_raw_signals: 100
  min_approved_trades: 30
  max_rejection_rate: 0.95
  require_both_sides: false

walk_forward:
  train_months: 12
  validation_months: 3
  test_months: 3
  step_months: 3

robustness:
  remove_best_n: [1, 3]
  double_worst_n: [1, 3]
  monte_carlo_iterations: 100
  random_seed: 42

reports:
  edge_report: true

promotion_gates:
  research_candidate:
    min_trades: 30

shadow:
  broker: mt5
  send_orders: false
  poll_seconds: 60

real_data:
  source: mt5
  bars: 250
  missing_bars_allowed: 0
  allow_session_gaps: true
  max_session_gap_minutes: 180

execution:
  broker: mt5
  env_path: .env
  send_orders: false
  paper_equity: 10000
  live_enabled: false
  confirm_live: ""
  allow_existing_positions: false
